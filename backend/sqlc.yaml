version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"          # sqlc reads *.up.sql, ignores *.down.sql
    queries: "query"
    strict_function_checks: true
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true   # nullable columns -> *T
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "citext"
            go_type: "string"
          - db_type: "inet"
            go_type: "string"
